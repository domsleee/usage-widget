[package]
name = "usage-widget"
version = "1.0.8"
edition = "2024"
description = "Tiny always-on-top desktop widget showing Copilot, Claude and Codex usage"
publish = false

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence"] }
ureq = { version = "3", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
raw-window-handle = "0.6"
sha2 = "0.11.0"

[profile.release]
lto = "thin"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
tray-icon = "0.24.2"
winit = "0.30"
