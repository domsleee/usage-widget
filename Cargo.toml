[package]
name = "usage-widget"
version = "1.0.12"
edition = "2024"
description = "Tiny always-on-top desktop widget showing Copilot, Claude, Codex and Antigravity usage"
publish = false

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence"] }
ureq = { version = "3", default-features = false, features = ["json", "native-tls-no-default"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = { version = "0.23", default-features = false, features = ["std"] }
raw-window-handle = "0.6"
sha2 = { version = "0.11.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }
serde_ignored = "0.1"

[profile.release]
lto = "thin"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSApplication", "NSGraphics", "NSResponder", "NSView", "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSError", "NSGeometry", "NSObject", "NSProcessInfo", "NSString", "NSURL", "NSURLRequest", "NSUUID",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "WKNavigation", "WKNavigationAction", "WKUIDelegate", "WKWebView", "WKWebViewConfiguration",
    "WKWebsiteDataStore", "WKWindowFeatures", "block2", "objc2-app-kit", "objc2-core-foundation",
] }
block2 = "0.6"
tray-icon = { version = "0.24.2", default-features = false }
winit = { version = "0.30", default-features = false }
