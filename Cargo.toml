[package]
name = "usage-widget"
version = "0.1.0"
edition = "2024"
description = "Tiny always-on-top desktop widget showing Copilot, Claude and Codex usage"
publish = false

[dependencies]
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
ureq = { version = "3", features = ["json", "platform-verifier"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
base64 = "0.22"
raw-window-handle = "0.6"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }

[profile.release]
lto = "thin"
strip = true
