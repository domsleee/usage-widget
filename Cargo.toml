[package]
name = "usage-widget"
version = "1.0.0"
edition = "2024"
description = "Tiny always-on-top desktop widget showing Copilot, Claude and Codex usage"
publish = false

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence"] }
ureq = { version = "3", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
raw-window-handle = "0.6"

[profile.release]
lto = "thin"
strip = true
